[project]
name = "uce-cli"
version = "0.1.0"
description = "Universal Competency Engine — CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dr. Rami B. H." }]
dependencies = [
  "uce-core",
  "uce-runtime",
  "uce-llm",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
competency = "uce_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uce_cli"]

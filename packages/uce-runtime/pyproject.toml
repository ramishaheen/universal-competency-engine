[project]
name = "uce-runtime"
version = "0.1.0"
description = "Universal Competency Engine — runtime (reasoning, workflow, memory, policy, executor)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dr. Rami B. H." }]
dependencies = [
  "uce-core",
  "uce-llm",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uce_runtime"]

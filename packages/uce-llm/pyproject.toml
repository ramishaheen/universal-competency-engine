[project]
name = "uce-llm"
version = "0.1.0"
description = "Universal Competency Engine — LLM provider adapters (Anthropic, OpenAI, Ollama)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dr. Rami B. H." }]
dependencies = [
  "anthropic>=0.40",
  "openai>=1.50",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uce_llm"]

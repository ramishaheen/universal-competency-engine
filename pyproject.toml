[project]
name = "universal-competency-engine"
version = "0.1.0"
description = "Universal Competency Engine — turn AI agents into integrated expert competencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dr. Rami B. H.", email = "dr.rami.b.h@gmail.com" }]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
uce-core = { workspace = true }
uce-runtime = { workspace = true }
uce-llm = { workspace = true }
uce-api = { workspace = true }
uce-cli = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["apps/studio", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
